services:
  piano:
    build: .
    ports:
      # Host port is configurable: PIANO_PORT=8081 docker compose up (or set it in .env)
      - "${PIANO_PORT:-8080}:80"
    volumes:
      # Mounted read-only so edits show up on refresh without rebuilding
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
